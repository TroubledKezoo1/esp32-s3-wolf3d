[env:esp32s3box]
platform = espressif32
board = esp32s3box
framework = arduino

; Serial Monitor & Upload Settings
monitor_speed = 115200
upload_speed = 115200

; Board Memory & Flash Settings (16MB Flash, 8MB OPI PSRAM)
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; Build Flags for ESP32-S3 PSRAM and Performance Optimization
build_flags = 
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -O3
    -ffast-math
    -I src/core
    -I src/engine
    -I src/data

build_src_filter = +<*> -<wolf4sdl/opl3.c>

; Dependencies for Display & Touch
lib_deps = 
    lovyan03/LovyanGFX@^1.1.16

; Debug env: boots straight into E1 level 1 (skips the menu) for remote timing runs
[env:esp32s3box_dbg]
extends = env:esp32s3box
build_flags =
    ${env:esp32s3box.build_flags}
    -D ESP32_DEBUG_AUTOSTART
